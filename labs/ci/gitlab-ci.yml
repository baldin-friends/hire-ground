# .gitlab-ci.yml · four shards, blob reports merged into one HTML report.
stages: [test, report]

e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble   # = @playwright/test version
  parallel: 4
  script:
    - npm ci
    - npx playwright test --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL -G @quarantine
  artifacts:
    when: always
    paths: [blob-report]
    expire_in: 1 day

merge-reports:
  stage: report
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  when: always
  script:
    - npm ci
    - npx playwright merge-reports --reporter html ./blob-report
  artifacts:
    when: always
    paths: [playwright-report]
    expire_in: 14 days
