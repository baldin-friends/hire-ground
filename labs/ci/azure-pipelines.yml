# azure-pipelines.yml · untested template: four parallel jobs in the pinned container.
trigger:
  - main

jobs:
  - job: e2e
    pool:
      vmImage: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      parallel: 4
    variables:
      CI: 'true'
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: results.xml
    steps:
      - script: npm ci
      - script: npx playwright test --shard=$(System.JobPositionInPhase)/$(System.TotalJobsInPhase) --reporter=junit
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: results.xml
