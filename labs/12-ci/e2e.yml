# Three shards in the pinned image, one merged HTML report. That is the plan.
# Part 1 of the challenge: this file loses the report of a red shard, in three places.
# Part 2: the gate and the nightly (the two TODOs).
# To use it, copy this file to .github/workflows/e2e.yml in a repository that has this lab at labs/12-ci.
# https://playwright.dev/docs/test-sharding#github-actions-example · https://playwright.dev/docs/ci
name: e2e
on:
  pull_request:
  push:
    branches: [main]
  # TODO part 2: a nightly run, Monday to Friday
  workflow_dispatch:

# TODO part 2: a pull request runs a selection (--grep @smoke); everything else runs everything

jobs:
  tests:
    runs-on: ubuntu-latest                                # self-hosted runners on Kubernetes: your runner label
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble   # = the @playwright/test version in package.json
      options: --user 1001
    strategy:
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci                                       # Playwright, as pinned in package-lock.json
      - run: npm ci --prefix app                          # the application under test
      - name: Run shard ${{ matrix.shardIndex }} of ${{ matrix.shardTotal }}
        working-directory: labs/12-ci
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: labs/12-ci/blob-report
          retention-days: 1

  merge-reports:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v5
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
