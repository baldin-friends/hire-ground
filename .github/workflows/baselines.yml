# Makes the baseline images of the visual comparison again (solutions/17-visual), on the machine of the pipeline.
# A baseline belongs to one browser on one platform, so the images are made where they are compared.
#
# Start it by hand: tab Actions, workflow "baselines", button "Run workflow". Or: gh workflow run baselines.yml
# Then download the artifact "baselines" of that run and commit the images in your pull request.
# https://playwright.dev/docs/test-snapshots
name: baselines
on:
  workflow_dispatch:

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble   # the same image as in e2e.yml
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix app
      - working-directory: solutions/17-visual
        run: npx playwright test 1-screenshots --update-snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: baselines
          path: solutions/17-visual/tests/__screenshots__
