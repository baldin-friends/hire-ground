# The pipeline of e2e.yml with eleven additions for a larger project. Read e2e.yml first.
# Every addition has a number. Every line without a number is the same as in e2e.yml.
#
# This workflow does not start by itself. Start it by hand: tab Actions, "e2e-extended", "Run workflow".
# In a terminal:   gh workflow run e2e-extended.yml -f args='--grep @smoke'
# The sheet lists the eleven additions with a link each: labs/12-ci/README.md
name: e2e-extended

on:
  # 1 · A manual start, with four fields. The last two belong to the additions 10 and 11.
  workflow_dispatch:
    inputs:
      args:
        description: 'More arguments for "npx playwright test", for example: --grep @smoke'
        default: ''
      base_url:
        description: 'Address of a deployed environment. Empty: the run starts its own application'
        default: ''
      slow:
        description: 'Also run the tests tagged @slow'
        type: boolean
        default: false
      update_baselines:
        description: 'Image comparison: write a new baseline instead of comparing'
        type: boolean
        default: false
  # 2 · A nightly run, Monday to Friday at 02:00 UTC. Remove the "#" of the next two lines to switch it on.
  #     GitHub reads a schedule only from the default branch.
  # schedule:
  #   - cron: '0 2 * * 1-5'

# 3 · The token of this run may read the repository and nothing else.
permissions:
  contents: read

# 4 · One run per branch: a new run cancels the one that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARGS: ${{ inputs.args }}
  BASE_URL: ${{ inputs.base_url }}        # playwright.config.ts reads it: with an address, it starts no application
  # 5 · The account for a deployed environment, from the secrets of the repository
  #     (Settings, "Secrets and variables", Actions). Without them: the account of the seed data.
  E2E_USER: ${{ secrets.E2E_USER }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # 6 · Keeps the downloaded packages between runs. The key is made from the two lock files.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - name: Run shard ${{ matrix.shard }} of 3
        working-directory: solutions/12-ci
        # 7 · --fail-on-flaky-tests: a test that passes only on a retry fails the run.
        # 10 · --grep-invert @slow: this job leaves out the tests tagged @slow. The job "slow" runs them.
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob,github --fail-on-flaky-tests --grep-invert @slow $ARGS
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  # 10 · The tests tagged @slow, in a job of their own. It runs at night, or when the field "slow" is ticked.
  #      Its result goes into the same report as the other tests.
  slow:
    if: ${{ inputs.slow || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix app
      - name: Run the tests tagged @slow
        working-directory: solutions/12-ci
        run: npx playwright test --grep @slow --reporter=blob,github
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-slow.zip
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-slow
          path: blob-report
          retention-days: 1

  # 11 · Image comparison (solutions/17-visual): the job page against the baseline image in the repository,
  #      tests/__screenshots__/job-page-chromium-linux.png. A baseline is made where it is compared: in this image.
  #      With the field "update_baselines" ticked, the job writes a new baseline and uploads it. You commit it.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      UPDATE: ${{ inputs.update_baselines && '--update-snapshots' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix app
      - name: Compare the job page with its baseline
        working-directory: solutions/17-visual
        run: PLAYWRIGHT_HTML_OUTPUT_DIR="$GITHUB_WORKSPACE/visual-report" npx playwright test 1-screenshots --reporter=html,github $UPDATE
      # The report of this job: after a failure it shows the expected image, the actual one and the difference.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-report--attempt-${{ github.run_attempt }}
          path: visual-report
          retention-days: 14
      # Only after an update: the new baseline, to download and commit.
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.update_baselines }}
        with:
          name: baselines
          path: solutions/17-visual/tests/__screenshots__/*-linux.png
          retention-days: 14

  report:
    if: ${{ !cancelled() }}
    needs: [tests, slow]                  # "slow" may be skipped: the report is written anyway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      # 8 · Two reports from the same results: HTML for people, JUnit XML for a dashboard or a test management tool.
      - run: npx playwright merge-reports --reporter html,junit ./all-blob-reports
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: results.xml
      - uses: actions/upload-artifact@v7
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: junit--attempt-${{ github.run_attempt }}
          path: results.xml
          retention-days: 14
      # 9 · A summary on the page of the run: the two commands that open this report on a laptop.
      - run: |
          echo "### Report of this run" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gh run download ${{ github.run_id }} --name html-report--attempt-${{ github.run_attempt }} --dir report" >> "$GITHUB_STEP_SUMMARY"
          echo "npx playwright show-report report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
