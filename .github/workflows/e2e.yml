# The pipeline of this repository. It runs the suite of Case 8 (solutions/12-ci): the tests of Cases 1 to 6.
#
#   a pull request       the tests tagged @smoke
#   a push to main       all tests
#
# Three machines run one shard each. A second job merges their results into one HTML report.
# The sheet explains every line: labs/12-ci/README.md
# https://playwright.dev/docs/ci · https://playwright.dev/docs/test-sharding#github-actions-example
name: e2e
on:
  pull_request:
  push:
    branches: [main]

env:
  # The one expression of this file: a pull request runs a selection, a push to main runs everything.
  SELECTION: ${{ github.event_name == 'pull_request' && '--grep @smoke' || '' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble   # = the @playwright/test version in package.json
      options: --user 1001
    strategy:
      fail-fast: false                                    # a failed shard does not cancel the others
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci                                       # Playwright, as pinned in package-lock.json
      - run: npm ci --prefix app                          # the application under test
      - name: Run shard ${{ matrix.shard }} of 3
        working-directory: solutions/12-ci
        # blob: the raw result of this shard, for the merge. github: failures as annotations on the run.
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob,github $SELECTION
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}                           # also when tests failed: that is the report you need
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  report:
    if: ${{ !cancelled() }}                               # also when a shard failed
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
