# The pipeline of this repository.
#
#   a pull request       the gate: the tests tagged @smoke, and the visual comparison
#   a push to main       everything: the suite in three shards, the visual comparison, every case folder
#   every night          everything
#
# Every run ends with one report and a summary: on the page of the run, and as a comment on the pull request.
# The sheet explains every line: labs/12-ci/README.md
# https://playwright.dev/docs/ci · https://playwright.dev/docs/test-sharding#github-actions-example
name: e2e
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1-5'                                 # 02:00 UTC, Monday to Friday

# A new push to the same branch cancels the run that is still going: only the newest commit gets an answer.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write                                    # the last job writes its summary on the pull request

env:
  # A pull request runs the tests tagged @smoke. Everything else runs everything.
  SELECTION: ${{ github.event_name == 'pull_request' && '--grep @smoke' || '' }}
  # Against a deployed environment, instead of the application each machine starts for itself:
  #   BASE_URL: https://staging-3.example.com
  #   E2E_ENV: '@staging-3'
  #   E2E_USER: ${{ secrets.E2E_USER }}
  #   E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

jobs:
  # The suite of Case 8 (solutions/12-ci), cut into three shards.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble   # = the @playwright/test version in package.json
      options: --user 1001
    strategy:
      fail-fast: false                                    # a failed shard does not cancel the others
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci                                       # Playwright, as pinned in package-lock.json
      - run: npm ci --prefix app                          # the application under test
      - name: Run shard ${{ matrix.shard }} of 3
        working-directory: solutions/12-ci
        # blob: the raw result of this shard, for the merge. github: failures as annotations on the run and the pull request.
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob,github $SELECTION
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}                           # also when tests failed: that is the report you need
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  # The visual comparison (solutions/17-visual) against the baseline images in the repository.
  # They were made on this kind of machine, by the workflow in baselines.yml.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix app
      - name: Compare the pages with their baseline images
        working-directory: solutions/17-visual
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-visual.zip
        run: npx playwright test 1-screenshots --reporter=blob,github
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}                           # the result has the images: expected, actual and the difference
        with:
          name: blob-report-visual
          path: blob-report
          retention-days: 1

  # Every case folder of the course, as it is: one machine per folder. Not for a pull request: the gate stays fast.
  cases:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        folder: [02-setup, 03-locators, 04-forms, 05-tools, 06-locators, 07-assertions, 08-data, 09-network, 10-time, 11-parallel, 13-migration, 14-agents]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix app
      - name: Run the tests of solutions/${{ matrix.folder }}
        working-directory: solutions/${{ matrix.folder }}
        run: npx playwright test --reporter=github,html --grep-invert @fails-on-purpose
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: report-case-${{ matrix.folder }}
          path: playwright-report
          retention-days: 14

  # One report for the whole run: the three shards and the visual comparison, merged. And a summary of it.
  report:
    if: ${{ !cancelled() }}                               # also when a shard failed
    needs: [tests, visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports -c solutions/12-ci/merge.config.ts ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
      - name: Write the summary on the page of the run
        run: node scripts/ci-summary.mjs solutions/12-ci/results.json ${{ github.run_id }} | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Write the summary on the pull request
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file summary.md
