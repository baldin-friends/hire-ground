# The pipeline of this repository. It runs the suite of Case 8 (solutions/12-ci): Hire Ground and the tests of Cases 1 to 6.
#
#   a pull request       the gate: only the tests tagged @smoke
#   a push to main       everything
#   every night          everything
#   "Run workflow"       everything, started by hand in the Actions tab
#
# Three machines run one shard each. A fourth job merges their results into one HTML report.
# The sheet explains every line: labs/12-ci/README.md
# https://playwright.dev/docs/ci · https://playwright.dev/docs/test-sharding#github-actions-example
name: e2e
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1-5'                                 # 02:00 UTC, Monday to Friday
  workflow_dispatch:

# A new push to the same branch cancels the run that is still going: only the newest commit gets an answer.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # The gate is fast because it runs a selection, not because the machines are faster.
  SELECTION: ${{ github.event_name == 'pull_request' && '--grep @smoke' || '' }}
  # Against a deployed environment, instead of the application each machine starts for itself:
  #   BASE_URL: https://staging.example.com
  #   E2E_USER: ${{ secrets.E2E_USER }}
  #   E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble   # = the @playwright/test version in package.json
      options: --user 1001
    strategy:
      fail-fast: false                                    # a red shard does not cancel the others
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci                                       # Playwright, as pinned in package-lock.json
      - run: npm ci --prefix app                          # the application under test
      - name: Run shard ${{ matrix.shard }} of 3
        working-directory: solutions/12-ci
        # blob: the raw result of this shard, for the merge. github: failures as annotations on the run and the pull request.
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob,github $SELECTION
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}                           # also when tests failed: that is the report you need
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}                               # also when a shard was red
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
