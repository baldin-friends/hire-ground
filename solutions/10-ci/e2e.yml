# Four shards in the pinned image, one merged HTML report.
# Copy to .github/workflows/e2e.yml in your own copy of this repository.
name: e2e
on:
  push:
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble   # = the @playwright/test version in package.json
      options: --user 1001
    strategy:
      fail-fast: false                                   # one red shard does not cancel the others
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v6
      - run: npm ci                                      # Playwright, as pinned in package-lock.json
      - run: npm ci --prefix app                         # the app under test
      - run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        working-directory: labs/10-ci
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}                          # also when tests fail: that is when you need it
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [playwright-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v5
        with:
          name: html-report
          path: playwright-report
          retention-days: 14
