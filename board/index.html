<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<style>
    :root { --bg: #000; --fg: #fff; --line: rgba(255,255,255,.35); --tile: #1c1c1c; --accent: #1fe3ae; --pink: #ff3fa8; --blue: #45c1ff; --yellow: #ffd84a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 32px; padding: 18px 24px 10px; }
    h1 { margin: 0; font-size: 34px; font-weight: 500; letter-spacing: -.02em; }
    header p { margin: 0; }
    .join { margin-left: auto; font-size: 22px; }
    .join b { color: var(--accent); font-weight: 500; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 0 24px 12px; }
    button, input { font: inherit; color: var(--fg); background: #000; border: 1px solid var(--line); padding: 7px 14px; }
    button { cursor: pointer; }
    button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
    button.on { background: var(--accent); border-color: var(--accent); color: #000; }
    input { min-width: 240px; }
    .who { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .dot { display: inline-block; min-width: 22px; padding: 1px 7px; border-radius: 11px; font-size: 13px; line-height: 20px; color: #000; text-align: center; }
    .tray { display: flex; flex-wrap: wrap; gap: 10px; min-height: 64px; margin: 0 24px 14px; padding: 12px; border: 1px dashed var(--line); }
    .cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; padding: 0 24px 24px; }
    .col { min-height: 46vh; padding: 10px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    .col.over, .tray.over { border-color: var(--accent); background: rgba(31,227,174,.08); }
    .col h2 { margin: 0 0 4px; font-size: 20px; font-weight: 500; color: var(--accent); }
    .col small { display: block; font-size: 13px; }
    .card { background: var(--tile); border: 1px solid transparent; padding: 8px 10px; font-size: 16px; cursor: grab; user-select: none; }
    .card b { color: var(--yellow); font-weight: 500; margin-right: 6px; }
    .card.picked { border-color: var(--accent); }
    .card.split { border-color: var(--pink); }
    .card .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .answer { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--accent); font-size: 14px; }
    .answer p { margin: 4px 0; }
    .answer b { color: var(--yellow); font-weight: 500; margin-right: 6px; }
    .lobby { padding: 8px 24px 32px; max-width: 900px; }
    .lobby li { margin: 14px 0; }
    a { color: var(--accent); }
    .hint { padding: 0 24px 16px; margin: 0; font-size: 15px; }
    .qr { width: 96px; height: 96px; background: #fff; padding: 4px; cursor: zoom-in; vertical-align: middle; margin-left: 14px; }
    .qr.big { position: fixed; inset: 0; margin: auto; width: min(70vh, 70vw); height: min(70vh, 70vw); padding: 16px; z-index: 10; cursor: zoom-out; box-shadow: 0 0 0 100vmax rgba(0,0,0,.85); }
    .list { padding: 0 16px 24px; display: grid; gap: 10px; }
    .list .row { background: var(--tile); padding: 10px 12px; }
    .list .row p { margin: 0 0 8px; }
    .list .row b { color: var(--yellow); font-weight: 500; margin-right: 6px; }
    select { font: inherit; color: var(--fg); background: #000; border: 1px solid var(--line); padding: 8px 10px; width: 100%; }
    .list .row.sorted select { border-color: var(--accent); }
    @media (max-width: 760px) { h1 { font-size: 24px; } header { padding: 14px 16px 8px; } .bar { padding: 0 16px 10px; } input { min-width: 0; width: 100%; } }
    @media print {
        body { background: #fff; color: #000; font-size: 15px; }
        header .join, .bar { display: none; }
        .print { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 0 12px; }
        .print div { border: 1px dashed #000 !important; padding: 18px 14px; min-height: 120px; break-inside: avoid; }
        .print div.head { font-size: 22px; font-weight: 600; color: #000 !important; }
        .print b { margin-right: 6px; }
    }
    .print { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 0 24px 24px; }
    .print div { border: 1px dashed var(--line); padding: 18px 14px; min-height: 120px; }
    .print div.head { font-size: 22px; color: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const params = new URLSearchParams(location.search);
const boardId = params.get('b');
const isHost = params.get('host') === '1';
const isPrint = params.get('print') === '1';
const app = document.getElementById('app');
const palette = ['#45c1ff', '#ff3fa8', '#ffd84a', '#1fe3ae', '#b388ff', '#ff8a3d', '#9be564', '#ff6b6b', '#7de3ff', '#f5a3ff'];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const get = (path) => fetch(path).then((r) => r.json());
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json());

let board, state, info = { urls: [] }, picked = null, dragging = false, lastVersion = -1, bigQr = false;
const narrow = () => !isHost && window.innerWidth < 760;
let group = isHost ? 'Room' : localStorage.getItem('board-group') || '';

async function lobby() {
    const [boards, inf] = await Promise.all([get('/boards'), get('/info')]);
    document.title = 'Boards';
    app.innerHTML = `<header><h1>Boards</h1><p class="join">Join: <b>${esc(inf.urls[0] ?? location.origin)}</b></p></header>
        <ul class="lobby">${boards.map((b) => `<li><b>${esc(b.title)}</b> · ${b.cards} cards<br>${esc(b.question)}<br>
            <a href="?b=${b.id}&host=1">Open as host (projector)</a> · <a href="?b=${b.id}">Join as a group</a> · <a href="?b=${b.id}&print=1">Paper cards</a></li>`).join('')}</ul>
        <p class="hint">The host opens a board on the projector. Everybody else opens the "Join" address and picks the same board.</p>`;
}

const allCards = () => [...board.cards, ...state.extra];
const visibleCards = () => allCards().slice(0, isHost || state.revealed > 0 ? state.revealed : 0);
const groups = () => Object.keys(state.placements).filter((g) => Object.keys(state.placements[g]).length > 0).sort();
const colour = (g) => palette[groups().indexOf(g) % palette.length];

function cardHtml(card, who) {
    const columnsUsed = new Set(groups().map((g) => state.placements[g][card.id]).filter(Boolean));
    const split = isHost && columnsUsed.size > 1;
    const dots = isHost && who.length ? `<div class="dots">${who.map((g) => `<span class="dot" style="background:${colour(g)}">${esc(g)}</span>`).join('')}</div>` : '';
    return `<div class="card${picked === card.id ? ' picked' : ''}${split ? ' split' : ''}" draggable="true" data-card="${esc(card.id)}" role="button" tabindex="0" aria-pressed="${picked === card.id}"><b>${esc(card.id.replace(/^x/, '+'))}</b>${esc(card.text)}${dots}</div>`;
}

function render() {
    const cards = visibleCards();
    const mine = state.placements[group] ?? {};
    const placedBy = (card, column) => (isHost ? groups().filter((g) => state.placements[g][card.id] === column) : mine[card.id] === column ? [group] : []);
    const inTray = cards.filter((c) => (isHost ? groups().every((g) => !state.placements[g][c.id]) : !mine[c.id]));
    const total = allCards().length;

    const hostBar = `<div class="bar">
            <button data-act="reveal"${state.revealed >= total ? ' disabled' : ''}>Reveal next card (${state.revealed}/${total})</button>
            <button data-act="revealAll">Reveal all</button>
            <button data-act="answer" class="${state.answer ? 'on' : ''}">${board.answer ? 'One possible answer' : 'No answer stored'}</button>
            <input id="new" placeholder="Add a card, then press Enter" aria-label="Add a card">
            <button data-act="reset">Reset</button>
            <span class="who">${groups().map((g) => `<span class="dot" style="background:${colour(g)}">${esc(g)}</span>`).join('') || 'No group has placed a card yet.'}</span>
        </div>`;
    const joinBar = `<div class="bar"><label>Your group: <input id="group" value="${esc(group)}" placeholder="a name, for example Group 2" aria-label="Your group"></label>
            <span>${group ? 'Drag a card into a box, or click a card and then a box.' : 'Type a group name first.'}</span></div>`;

    app.innerHTML = `<header><h1>${esc(board.title)}</h1><p>${esc(board.question)}</p>
            ${isHost ? `<p class="join">Join: <b>${esc(info.urls[0] ?? location.origin)}</b>${info.qr ? `<img class="qr${bigQr ? ' big' : ''}" src="/qr.svg" alt="QR code of the join address" title="Click to enlarge">` : ''}</p>` : ''}</header>
        ${isHost ? hostBar : joinBar}
        ${narrow() ? `<div class="list">${cards.map((c) => `<div class="row${mine[c.id] ? ' sorted' : ''}"><p><b>${esc(c.id.replace(/^x/, '+'))}</b>${esc(c.text)}</p>
            <select data-pick="${esc(c.id)}" aria-label="Box for card ${esc(c.id)}"${group ? '' : ' disabled'}><option value="">not sorted yet</option>${board.columns.map((col) => `<option value="${esc(col.id)}"${mine[c.id] === col.id ? ' selected' : ''}>${esc(col.label)}</option>`).join('')}</select></div>`).join('') || `<p>The cards appear here when the host reveals them.</p>`}</div>` : `
        <div class="tray" data-column="">${inTray.map((c) => cardHtml(c, [])).join('') || `<span>${state.revealed === 0 ? (isHost ? 'Press “Reveal next card” to show the first card.' : 'The cards appear here when the host reveals them.') : 'All cards are placed.'}</span>`}</div>
        <div class="cols" style="--n:${board.columns.length}">${board.columns.map((col) => {
            const here = cards.filter((c) => placedBy(c, col.id).length);
            const answers = state.answer && board.answer ? allCards().filter((c) => board.answer[c.id]?.column === col.id) : [];
            return `<section class="col" data-column="${esc(col.id)}" aria-label="${esc(col.label)}"><h2>${esc(col.label)}${col.hint ? `<small>${esc(col.hint)}</small>` : ''}</h2>
                ${here.map((c) => cardHtml(c, placedBy(c, col.id))).join('')}
                ${answers.length ? `<div class="answer">${answers.map((c) => `<p><b>${esc(c.id)}</b>${esc(board.answer[c.id].why)}</p>`).join('')}</div>` : ''}</section>`;
        }).join('')}</div>`}`;
}

async function place(cardId, column) {
    if (!group) return;
    picked = null;
    state = await post('/place', { b: boardId, group, card: cardId, column: column || null });
    lastVersion = state.version;
    render();
}

app.addEventListener('click', async (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act) {
        if (act === 'reset' && !confirm('Empty the board for everybody?')) return;
        state = await post('/host', { b: boardId, action: act });
        lastVersion = state.version;
        return render();
    }
    if (e.target.closest('.qr')) {
        bigQr = !bigQr;
        return render();
    }
    const card = e.target.closest('.card');
    if (card) {
        picked = picked === card.dataset.card ? null : card.dataset.card;
        return render();
    }
    const zone = e.target.closest('[data-column]');
    if (zone && picked) place(picked, zone.dataset.column);
});
app.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'new' && e.target.value.trim()) {
        state = await post('/host', { b: boardId, action: 'addCard', text: e.target.value });
        lastVersion = state.version;
        render();
        document.getElementById('new')?.focus();
    }
    if (e.target.classList?.contains('card')) e.target.click();
});
app.addEventListener('change', (e) => {
    if (e.target.dataset?.pick) return place(e.target.dataset.pick, e.target.value);
    if (e.target.id !== 'group') return;
    group = e.target.value.replace(/\s+/g, ' ').trim().slice(0, 24);
    localStorage.setItem('board-group', group);
    render();
});
app.addEventListener('dragstart', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    dragging = true;
    e.dataTransfer.setData('text/plain', card.dataset.card);
    e.dataTransfer.effectAllowed = 'move';
});
app.addEventListener('dragend', () => { dragging = false; });
app.addEventListener('dragover', (e) => {
    const zone = e.target.closest('[data-column]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.add('over');
});
app.addEventListener('dragleave', (e) => e.target.closest?.('[data-column]')?.classList.remove('over'));
app.addEventListener('drop', (e) => {
    const zone = e.target.closest('[data-column]');
    if (!zone) return;
    e.preventDefault();
    dragging = false;
    place(e.dataTransfer.getData('text/plain'), zone.dataset.column);
});

async function poll() {
    try {
        const next = await get(`/state?b=${boardId}`);
        const typing = ['new', 'group'].includes(document.activeElement?.id) || document.activeElement?.tagName === 'SELECT';
        if (next.version !== lastVersion && !dragging && !typing) {
            state = next;
            lastVersion = next.version;
            render();
        }
    } catch { /* the server is away: keep what is on screen */ }
    setTimeout(poll, 1000);
}

function printView() {
    document.title = `${board.title} · paper cards`;
    app.innerHTML = `<header><h1>${esc(board.title)}</h1><p>${esc(board.question)} Print this page, cut along the lines. The boxes go on a table or a wall, the cards into them.</p></header>
        <div class="print">${board.columns.map((c) => `<div class="head">${esc(c.label)}</div>`).join('')}${board.cards.map((c) => `<div><b>${esc(c.id)}</b>${esc(c.text)}</div>`).join('')}</div>`;
}

(async () => {
    if (!boardId) return lobby();
    [board, state, info] = await Promise.all([get(`/board?b=${boardId}`), get(`/state?b=${boardId}`), get('/info')]);
    if (board.error) return lobby();
    document.title = board.title;
    if (isPrint) return printView();
    lastVersion = state.version;
    render();
    poll();
    let wasNarrow = narrow();
    window.addEventListener('resize', () => { if (narrow() !== wasNarrow) { wasNarrow = narrow(); render(); } });
})();
</script>
</body>
</html>
